<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Modern Amber Honey Gradients -->
    <linearGradient id="amber-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="wing-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="dark-espresso" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="honey-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Circle -->
  <circle cx="250" cy="250" r="210" fill="#D97706" opacity="0.12" filter="url(#honey-glow)" />

  <!-- Outer Honeycomb Hexagon Frame -->
  <polygon points="250,30 430,134 430,366 250,470 70,366 70,134" 
           fill="url(#dark-espresso)" 
           stroke="url(#amber-gold)" 
           stroke-width="14" 
           stroke-linejoin="round" />

  <!-- Inner Decorative Hexagon Grid Inset -->
  <polygon points="250,54 408,145 408,355 250,446 92,355 92,145" 
           fill="none" 
           stroke="#FDE68A" 
           stroke-width="2" 
           opacity="0.25" 
           stroke-linejoin="round" />

  <!-- BEE WINGS (GEOMETRIC LAYER) -->
  <!-- Left Upper Wing -->
  <path d="M 210 210 C 120 120, 60 170, 120 250 C 160 300, 200 260, 220 235 Z" 
        fill="url(#wing-light)" 
        stroke="#FDE68A" 
        stroke-width="3" />
  
  <!-- Left Lower Wing -->
  <path d="M 205 255 C 130 270, 95 330, 150 360 C 190 380, 215 320, 215 285 Z" 
        fill="url(#wing-light)" 
        opacity="0.75" 
        stroke="#FDE68A" 
        stroke-width="2" />

  <!-- Right Upper Wing -->
  <path d="M 290 210 C 380 120, 440 170, 380 250 C 340 300, 300 260, 280 235 Z" 
        fill="url(#wing-light)" 
        stroke="#FDE68A" 
        stroke-width="3" />
  
  <!-- Right Lower Wing -->
  <path d="M 295 255 C 370 270, 405 330, 350 360 C 310 380, 285 320, 285 285 Z" 
        fill="url(#wing-light)" 
        opacity="0.75" 
        stroke="#FDE68A" 
        stroke-width="2" />

  <!-- CENTRAL TABLETOP MEEPLE WITH BEE STEEP STRIPES -->
  <!-- Meeple Outline Shape -->
  <path d="
    M 250 125 
    C 272 125, 290 143, 290 165 
    C 290 187, 272 205, 250 205 
    C 228 205, 210 187, 210 165 
    C 210 143, 228 125, 250 125 Z
    M 205 220
    C 225 210, 275 210, 295 220
    C 315 230, 350 260, 345 315
    L 365 405
    C 368 418, 335 422, 325 405
    L 295 340
    L 250 355
    L 205 340
    L 175 405
    C 165 422, 132 418, 135 405
    L 155 315
    C 150 260, 185 230, 205 220 Z" 
    fill="url(#amber-gold)" 
    stroke="#1C1917" 
    stroke-width="6" 
    stroke-linejoin="round" />

  <!-- Meeple Bee Stripes (Deep Espresso Inset Stripes for Bee Motif) -->
  <path d="M 178 280 Q 250 305 322 280" stroke="#1C1917" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M 168 325 Q 250 355 332 325" stroke="#1C1917" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Crown / Antenna Highlight on Meeple Head -->
  <circle cx="250" cy="165" r="14" fill="#FDE68A" opacity="0.8" />
  <path d="M 235 125 L 222 105 M 265 125 L 278 105" stroke="#FDE68A" stroke-width="5" stroke-linecap="round" />
  <circle cx="222" cy="105" r="5" fill="#FDE68A" />
  <circle cx="278" cy="105" r="5" fill="#FDE68A" />
</svg>
