    stroke-width="1" />

  <!-- Bee Stripe Accents -->
  <path d="M 22 31 Q 32 35 42 31" stroke="#1C1917" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 21 37 Q 32 41 43 37" stroke="#1C1917" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
