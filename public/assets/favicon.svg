    M 25 24 
    C 27 23, 37 23, 39 24 
    C 42 25, 46 29, 45 36 
    L 48 50 
    C 48.5 52, 43.5 52, 42.5 50 
    L 38 42 
    L 32 44 
    L 26 42 
    L 21.5 50 
    C 20.5 52, 15.5 52, 16 50 
    L 19 36 
    C 18 29, 22 25, 25 24 Z" 
    fill="url(#fav-amber)" 
